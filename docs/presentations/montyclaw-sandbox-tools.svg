<svg viewBox="0 0 1200 660" font-family="Instrument Sans, system-ui, sans-serif" role="img" aria-label="MontyClaw runs model-written Python in the Monty sandbox through the Pydantic AI harness instead of exec(), with credentials held in the host-side tool layer.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F8A57"/>
    </marker>
  </defs>

  <!-- ============ left: what we don't do ============ -->
  <g>
    <rect x="20" y="20" width="360" height="600" rx="18" fill="#FDF0F0" stroke="#D74248" stroke-width="1.6"/>
    <text x="52" y="62" font-size="13" font-weight="600" fill="#D74248" letter-spacing="1.2">NOT THIS</text>
    <text x="52" y="98" font-size="21" font-weight="700" fill="#232833">The obvious code tool</text>

    <rect x="52" y="122" width="296" height="72" rx="10" fill="#23272E"/>
    <text x="72" y="150" font-size="13" font-family="JetBrains Mono, monospace" fill="#E06C75">exec</text>
    <text x="106" y="150" font-size="13" font-family="JetBrains Mono, monospace" fill="#ABB2BF">(model_code, globals())</text>
    <text x="72" y="176" font-size="13" font-family="JetBrains Mono, monospace" fill="#5C6370"># ...in your own process</text>

    <g font-size="14" fill="#232833">
      <text x="52" y="238" font-weight="600">Same interpreter as the app</text>
      <text x="52" y="260" font-size="13" fill="#6E6A61">The model&#8217;s code and your code share a heap.</text>

      <text x="52" y="308" font-weight="600">Same environment</text>
      <text x="52" y="330" font-size="13" fill="#6E6A61">os.environ, ~/.config, the metadata server &#8212;</text>
      <text x="52" y="348" font-size="13" fill="#6E6A61">every secret the container holds.</text>

      <text x="52" y="396" font-weight="600">Same network and disk</text>
      <text x="52" y="418" font-size="13" fill="#6E6A61">Any host it can reach, any file it can open.</text>

      <text x="52" y="466" font-weight="600">Sandboxing bolted on afterwards</text>
      <text x="52" y="488" font-size="13" fill="#6E6A61">AST allow-lists and builtins stripping are a</text>
      <text x="52" y="506" font-size="13" fill="#6E6A61">game of whack-a-mole, not a boundary.</text>
    </g>

    <rect x="52" y="536" width="296" height="60" rx="10" fill="#D74248"/>
    <text x="200" y="562" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">One prompt injection away</text>
    <text x="200" y="582" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">from the service account.</text>
  </g>

  <!-- ============ right: the MontyClaw stack ============ -->
  <text x="424" y="62" font-size="13" font-weight="600" fill="#1F8A57" letter-spacing="1.2">MONTYCLAW</text>
  <text x="424" y="98" font-size="21" font-weight="700" fill="#232833">Execution and authority, kept apart</text>

  <!-- layer 1 -->
  <g>
    <rect x="424" y="120" width="752" height="70" rx="12" fill="#FFFFFF" stroke="#232833" stroke-width="1.4"/>
    <text x="450" y="150" font-size="16" font-weight="600" fill="#232833">Pydantic AI harness &#183; CodeMode</text>
    <text x="450" y="172" font-size="12.5" fill="#6E6A61">the model calls run_code &#8212; the harness parses it and dispatches the tool calls inside it</text>
    <text x="1150" y="150" font-size="12" font-family="JetBrains Mono, monospace" fill="#6E6A61" text-anchor="end">run_code</text>
  </g>
  <line x1="800" y1="190" x2="800" y2="216" stroke="currentColor" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- layer 2: sandbox -->
  <g>
    <rect x="424" y="218" width="752" height="150" rx="12" fill="#F3F1EA" stroke="#232833" stroke-width="1.4"/>
    <text x="450" y="250" font-size="16" font-weight="600" fill="#232833">Monty sandbox</text>
    <text x="450" y="272" font-size="12.5" fill="#6E6A61">pydantic-monty &#183; a Python subset written in Rust, run in a subprocess worker &#8212; never CPython exec()</text>
    <g font-size="12.5" font-family="JetBrains Mono, monospace" fill="#232833">
      <rect x="450" y="292" width="152" height="30" rx="8" fill="#FFFFFF" stroke="#C9C3B4"/>
      <text x="526" y="312" text-anchor="middle">no network</text>
      <rect x="614" y="292" width="152" height="30" rx="8" fill="#FFFFFF" stroke="#C9C3B4"/>
      <text x="690" y="312" text-anchor="middle">no filesystem</text>
      <rect x="778" y="292" width="152" height="30" rx="8" fill="#FFFFFF" stroke="#C9C3B4"/>
      <text x="854" y="312" text-anchor="middle">no env vars</text>
      <rect x="942" y="292" width="208" height="30" rx="8" fill="#FFFFFF" stroke="#C9C3B4"/>
      <text x="1046" y="312" text-anchor="middle">time + memory limits</text>
    </g>
    <text x="450" y="348" font-size="12.5" fill="#6E6A61">Model-written code can loop, branch and hold state &#8212; and reach nothing it was not handed.</text>
  </g>

  <!-- boundary -->
  <line x1="424" y1="392" x2="1176" y2="392" stroke="#1F8A57" stroke-width="1.8" stroke-dasharray="7 6"/>
  <rect x="612" y="378" width="376" height="28" rx="14" fill="#E7F4EC" stroke="#1F8A57" stroke-width="1.2"/>
  <text x="800" y="397" font-size="12.5" font-weight="600" fill="#1F8A57" text-anchor="middle">capability boundary &#183; the only doors we opened</text>
  <line x1="800" y1="406" x2="800" y2="432" stroke="#1F8A57" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- layer 3: tools -->
  <g>
    <rect x="424" y="434" width="752" height="118" rx="12" fill="#FFFFFF" stroke="#1F8A57" stroke-width="1.6"/>
    <text x="450" y="464" font-size="16" font-weight="600" fill="#232833">Tool layer &#8212; host side</text>
    <text x="450" y="486" font-size="12.5" fill="#6E6A61">Every credential, every service client and every check lives here, in ordinary Python we wrote.</text>
    <g font-size="12.5" font-family="JetBrains Mono, monospace" fill="#232833">
      <rect x="450" y="502" width="222" height="32" rx="8" fill="#F7F8FA" stroke="#C9C3B4"/>
      <text x="561" y="523" text-anchor="middle">llm_query()</text>
      <rect x="684" y="502" width="222" height="32" rx="8" fill="#F7F8FA" stroke="#C9C3B4"/>
      <text x="795" y="523" text-anchor="middle">generate_image()</text>
      <rect x="918" y="502" width="232" height="32" rx="8" fill="#F7F8FA" stroke="#C9C3B4"/>
      <text x="1034" y="523" text-anchor="middle">send_message()</text>
    </g>
  </g>

  <!-- layer 4: services -->
  <g font-size="12.5" fill="#6E6A61">
    <line x1="561" y1="552" x2="561" y2="584" stroke="#6E6A61" stroke-width="1.2" marker-end="url(#a)"/>
    <line x1="795" y1="552" x2="795" y2="584" stroke="#6E6A61" stroke-width="1.2" marker-end="url(#a)"/>
    <line x1="1034" y1="552" x2="1034" y2="584" stroke="#6E6A61" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="561" y="604" text-anchor="middle">LLM endpoint</text>
    <text x="561" y="622" text-anchor="middle" font-size="11.5">API key</text>
    <text x="795" y="604" text-anchor="middle">Cloud Storage</text>
    <text x="795" y="622" text-anchor="middle" font-size="11.5">service account</text>
    <text x="1034" y="604" text-anchor="middle">Telegram</text>
    <text x="1034" y="622" text-anchor="middle" font-size="11.5">bot token</text>
  </g>
</svg>
